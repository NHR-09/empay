<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EmpPay - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="card p-4 text-center" style="width: 100%; max-width: 400px;">
        <h4 class="fw-bold text-primary mb-1">EmpPay</h4>
        <p class="text-muted mb-3">Welcome, <span id="userName" class="fw-semibold"></span>!</p>
        <p class="text-muted">You are successfully logged in.</p>
        <button class="btn btn-outline-secondary mt-2" onclick="logout()">Logout</button>
    </div>

    <script>
        const user = JSON.parse(sessionStorage.getItem('user'));
        if (!user) window.location.href = '/index.html';
        document.getElementById('userName').textContent = user.name;

        function logout() {
            sessionStorage.clear();
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
