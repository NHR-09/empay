<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EmPay - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background: #f0f2f5; }</style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-sm border-0 rounded-3 p-4" style="width: 100%; max-width: 450px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h4 class="fw-bold text-primary mb-0">EmPay</h4>
                <small class="text-muted">Admin Panel</small>
            </div>
            <button class="btn btn-sm btn-outline-secondary" onclick="logout()">Logout</button>
        </div>

        <h6 class="mb-3">Create New User</h6>

        <div id="alert" class="alert d-none py-2 small"></div>

        <form id="createUserForm">
            <div class="row mb-3">
                <div class="col">
                    <label class="form-label small fw-semibold text-muted text-uppercase">First Name</label>
                    <input type="text" id="firstName" class="form-control" placeholder="John" required>
                </div>
                <div class="col">
                    <label class="form-label small fw-semibold text-muted text-uppercase">Last Name</label>
                    <input type="text" id="lastName" class="form-control" placeholder="Doe" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted text-uppercase">Email</label>
                <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted text-uppercase">Phone</label>
                <input type="text" id="phone" class="form-control" placeholder="9999999999">
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold text-muted text-uppercase">Role</label>
                <select id="role" class="form-select">
                    <option value="EMPLOYEE">Employee</option>
                    <option value="HR_OFFICER">HR Officer</option>
                    <option value="PAYROLL_OFFICER">Payroll Officer</option>
                    <option value="ADMIN">Admin</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-semibold">Create User & Send Password</button>
        </form>
    </div>

    <script>
        const user = JSON.parse(sessionStorage.getItem('user'));
        if (!user || user.role !== 'ADMIN') window.location.href = '/index.html';

        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertEl = document.getElementById('alert');

            const res = await fetch('/api/admin/create-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    firstName: document.getElementById('firstName').value,
                    lastName:  document.getElementById('lastName').value,
                    email:     document.getElementById('email').value,
                    phone:     document.getElementById('phone').value,
                    role:      document.getElementById('role').value
                })
            });

            const data = await res.json();
            alertEl.className = res.ok ? 'alert alert-success py-2 small' : 'alert alert-danger py-2 small';
            alertEl.textContent = data.message;
            alertEl.classList.remove('d-none');

            if (res.ok) document.getElementById('createUserForm').reset();
        });

        function logout() {
            sessionStorage.clear();
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
