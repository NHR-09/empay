<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EmpPay - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="card p-4" style="width: 100%; max-width: 450px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h4 class="fw-bold text-primary mb-0">EmpPay</h4>
                <small class="text-muted">Admin Panel</small>
            </div>
            <button class="btn btn-sm btn-outline-secondary" onclick="logout()">Logout</button>
        </div>

        <h6 class="mb-3">Create New User</h6>

        <div id="alert" class="alert d-none"></div>

        <form id="createUserForm">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="name" class="form-control" placeholder="John Doe" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Create User & Send Password</button>
        </form>
    </div>

    <script>
        const user = JSON.parse(sessionStorage.getItem('user'));
        if (!user || user.role !== 'ADMIN') window.location.href = '/index.html';

        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const alertEl = document.getElementById('alert');

            const res = await fetch('/api/admin/create-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email })
            });

            const data = await res.json();
            alertEl.className = res.ok ? 'alert alert-success' : 'alert alert-danger';
            alertEl.textContent = data.message;
            alertEl.classList.remove('d-none');

            if (res.ok) {
                document.getElementById('createUserForm').reset();
            }
        });

        function logout() {
            sessionStorage.clear();
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
