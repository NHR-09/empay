<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EmPay — Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2e3250;
      --accent: #6c63ff; --accent2: #a78bfa;
      --text: #e2e8f0; --muted: #8892a4;
      --danger: #ef4444; --success: #22c55e;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; font-size: 13px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 40px 36px; width: 100%; max-width: 380px; }
    .brand { margin-bottom: 28px; }
    .brand-logo { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .brand-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
    input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: 6px; font-size: 13px; font-family: inherit; outline: none; transition: border-color 0.15s; margin-bottom: 16px; }
    input:focus { border-color: var(--accent); }
    button { width: 100%; background: var(--accent); color: #fff; border: none; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.15s; margin-top: 4px; }
    button:hover { background: #5b52e8; }
    .alert { font-size: 12px; padding: 9px 12px; border-radius: 6px; margin-bottom: 16px; display: none; }
    .alert-danger { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--danger); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-logo">EmPay</div>
      <div class="brand-sub">Sign in to your account</div>
    </div>
    <div id="alert" class="alert alert-danger"></div>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@company.com" required>
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" required>
      <button type="submit">Login</button>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertEl = document.getElementById('alert');
      alertEl.style.display = 'none';
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
      });
      const data = await res.json();
      if (!res.ok) {
        alertEl.textContent = data.message;
        alertEl.style.display = 'block';
        return;
      }
      sessionStorage.setItem('user', JSON.stringify(data));
      window.location.href = data.mustChangePassword ? '/change-password.html' : '/dashboard.html';
    });
  </script>
</body>
</html>
