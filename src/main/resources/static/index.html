<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EmPay — Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #fff; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .box { width: 340px; border: 1px solid #ccc; padding: 32px; }
        h4 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        p { font-size: 13px; color: #666; margin-bottom: 24px; }
        label { display: block; font-size: 13px; margin-bottom: 4px; }
        input { width: 100%; border: 1px solid #000; padding: 8px 10px; font-size: 13px; margin-bottom: 16px; outline: none; }
        input:focus { border-color: #000; }
        button { width: 100%; background: #000; color: #fff; border: none; padding: 10px; font-size: 13px; cursor: pointer; }
        button:hover { background: #333; }
        .alert { font-size: 13px; padding: 8px 10px; margin-bottom: 16px; border: 1px solid #ccc; }
        .alert-danger { border-color: #000; background: #f5f5f5; }
    </style>
</head>
<body>
    <div class="box">
        <h4>EmPay HRMS</h4>
        <p>Sign in to your account</p>
        <div id="alert" class="alert" style="display:none;"></div>
        <form id="loginForm">
            <label>Email</label>
            <input type="email" id="email" required>
            <label>Password</label>
            <input type="password" id="password" required>
            <button type="submit">Login</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
            });
            const data = await res.json();
            const alertEl = document.getElementById('alert');
            if (!res.ok) {
                alertEl.className = 'alert alert-danger';
                alertEl.textContent = data.message;
                alertEl.style.display = 'block';
                return;
            }
            sessionStorage.setItem('user', JSON.stringify(data));
            window.location.href = data.mustChangePassword ? '/change-password.html' : '/dashboard.html';
        });
    </script>
</body>
</html>
