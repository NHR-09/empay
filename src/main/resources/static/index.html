<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EmPay — Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-sm border-0 rounded-3 p-4" style="width:100%;max-width:380px">
    <div class="mb-4">
      <h4 class="fw-bold text-primary mb-0">EmPay</h4>
      <small class="text-muted">Sign in to your account</small>
    </div>
    <div id="alert" class="alert alert-danger d-none py-2 small"></div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label small fw-semibold text-muted text-uppercase">Email</label>
        <input type="email" id="email" class="form-control" placeholder="you@company.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold text-muted text-uppercase">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-semibold">Login</button>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertEl = document.getElementById('alert');
      alertEl.classList.add('d-none');
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
      });
      const data = await res.json();
      if (!res.ok) {
        alertEl.textContent = data.message || 'Invalid Login Id or Password';
        alertEl.classList.remove('d-none');
        return;
      }
      sessionStorage.setItem('user', JSON.stringify(data));
      window.location.href = data.mustChangePassword ? '/change-password.html' : '/dashboard.html';
    });
  </script>
</body>
</html>
