<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EmPay — Set Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body { background: #f0f2f5; }</style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-sm border-0 rounded-3 p-4" style="width:100%;max-width:400px">
    <div class="mb-3">
      <h4 class="fw-bold text-primary mb-0">EmPay</h4>
      <small class="text-muted">Set Your New Password</small>
    </div>
    <div class="alert alert-warning py-2 small">⚠ You must change your temporary password before continuing.</div>
    <div id="alert" class="alert d-none py-2 small"></div>
    <form id="changeForm">
      <div class="mb-3">
        <label class="form-label small fw-semibold text-muted text-uppercase">Current (Temporary) Password</label>
        <input type="password" id="currentPassword" class="form-control" placeholder="••••••••" required>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold text-muted text-uppercase">New Password</label>
        <input type="password" id="newPassword" class="form-control" placeholder="Min. 8 characters" required minlength="8">
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold text-muted text-uppercase">Confirm New Password</label>
        <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-semibold">Set Password</button>
    </form>
  </div>
  <script>
    const user = JSON.parse(sessionStorage.getItem('user'));
    if (!user) window.location.href = '/index.html';
    document.getElementById('changeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const alertEl = document.getElementById('alert');
      alertEl.classList.add('d-none');
      if (newPassword !== confirmPassword) {
        alertEl.className = 'alert alert-danger py-2 small';
        alertEl.textContent = 'New passwords do not match.';
        alertEl.classList.remove('d-none');
        return;
      }
      const res = await fetch('/api/auth/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: user.email, currentPassword: document.getElementById('currentPassword').value, newPassword })
      });
      const data = await res.json();
      alertEl.className = res.ok ? 'alert alert-success py-2 small' : 'alert alert-danger py-2 small';
      alertEl.textContent = res.ok ? '✓ Password changed! Redirecting to login…' : data.message;
      alertEl.classList.remove('d-none');
      if (res.ok) setTimeout(() => window.location.href = '/index.html', 1500);
    });
  </script>
</body>
</html>
