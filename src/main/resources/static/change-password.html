<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EmPay — Change Password</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #fff; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .box { width: 360px; border: 1px solid #ccc; padding: 32px; }
        h4 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        p { font-size: 13px; color: #666; margin-bottom: 8px; }
        .notice { font-size: 12px; border: 1px solid #ccc; padding: 8px; margin-bottom: 20px; background: #f9f9f9; }
        label { display: block; font-size: 13px; margin-bottom: 4px; }
        input { width: 100%; border: 1px solid #000; padding: 8px 10px; font-size: 13px; margin-bottom: 16px; outline: none; }
        input:focus { border-color: #000; }
        button { width: 100%; background: #000; color: #fff; border: none; padding: 10px; font-size: 13px; cursor: pointer; }
        button:hover { background: #333; }
        .alert { font-size: 13px; padding: 8px 10px; margin-bottom: 16px; border: 1px solid #ccc; background: #f5f5f5; }
    </style>
</head>
<body>
    <div class="box">
        <h4>EmPay HRMS</h4>
        <p>Set Your New Password</p>
        <div class="notice">You must change your temporary password before continuing.</div>
        <div id="alert" class="alert" style="display:none;"></div>
        <form id="changeForm">
            <label>Current (Temporary) Password</label>
            <input type="password" id="currentPassword" required>
            <label>New Password</label>
            <input type="password" id="newPassword" required minlength="8">
            <label>Confirm New Password</label>
            <input type="password" id="confirmPassword" required>
            <button type="submit">Set Password</button>
        </form>
    </div>
    <script>
        const user = JSON.parse(sessionStorage.getItem('user'));
        if (!user) window.location.href = '/index.html';

        document.getElementById('changeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const alertEl = document.getElementById('alert');

            if (newPassword !== confirmPassword) {
                alertEl.textContent = 'New passwords do not match.';
                alertEl.style.display = 'block';
                return;
            }

            const res = await fetch('/api/auth/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: user.email, currentPassword: document.getElementById('currentPassword').value, newPassword })
            });
            const data = await res.json();
            alertEl.textContent = res.ok ? 'Password changed! Redirecting...' : data.message;
            alertEl.style.display = 'block';
            if (res.ok) setTimeout(() => window.location.href = '/index.html', 1500);
        });
    </script>
</body>
</html>
