<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EmPay — Set Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2e3250;
      --accent: #6c63ff; --accent2: #a78bfa;
      --text: #e2e8f0; --muted: #8892a4;
      --danger: #ef4444; --success: #22c55e; --warning: #f59e0b;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; font-size: 13px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 40px 36px; width: 100%; max-width: 400px; }
    .brand { margin-bottom: 24px; }
    .brand-logo { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .brand-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .notice { font-size: 12px; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); color: var(--warning); padding: 10px 12px; border-radius: 6px; margin-bottom: 20px; line-height: 1.5; }
    label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
    input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: 6px; font-size: 13px; font-family: inherit; outline: none; transition: border-color 0.15s; margin-bottom: 16px; }
    input:focus { border-color: var(--accent); }
    button { width: 100%; background: var(--accent); color: #fff; border: none; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.15s; margin-top: 4px; }
    button:hover { background: #5b52e8; }
    .alert { font-size: 12px; padding: 9px 12px; border-radius: 6px; margin-bottom: 16px; display: none; }
    .alert-danger  { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.3);  color: var(--danger); }
    .alert-success { background: rgba(34,197,94,0.1);  border: 1px solid rgba(34,197,94,0.3);  color: var(--success); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-logo">EmPay</div>
      <div class="brand-sub">Set Your New Password</div>
    </div>
    <div class="notice">⚠ You must change your temporary password before continuing.</div>
    <div id="alert" class="alert"></div>
    <form id="changeForm">
      <label>Current (Temporary) Password</label>
      <input type="password" id="currentPassword" placeholder="••••••••" required>
      <label>New Password</label>
      <input type="password" id="newPassword" placeholder="Min. 8 characters" required minlength="8">
      <label>Confirm New Password</label>
      <input type="password" id="confirmPassword" placeholder="••••••••" required>
      <button type="submit">Set Password</button>
    </form>
  </div>
  <script>
    const user = JSON.parse(sessionStorage.getItem('user'));
    if (!user) window.location.href = '/index.html';

    document.getElementById('changeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const alertEl = document.getElementById('alert');
      alertEl.style.display = 'none';

      if (newPassword !== confirmPassword) {
        alertEl.className = 'alert alert-danger';
        alertEl.textContent = 'New passwords do not match.';
        alertEl.style.display = 'block';
        return;
      }
      const res = await fetch('/api/auth/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: user.email, currentPassword: document.getElementById('currentPassword').value, newPassword })
      });
      const data = await res.json();
      alertEl.className = res.ok ? 'alert alert-success' : 'alert alert-danger';
      alertEl.textContent = res.ok ? '✓ Password changed! Redirecting to login…' : data.message;
      alertEl.style.display = 'block';
      if (res.ok) setTimeout(() => window.location.href = '/index.html', 1500);
    });
  </script>
</body>
</html>
