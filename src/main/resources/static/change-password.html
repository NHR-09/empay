<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EmpPay - Change Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="card p-4" style="width: 100%; max-width: 420px;">
        <h4 class="text-center mb-1 fw-bold text-primary">EmpPay</h4>
        <p class="text-center text-muted mb-1">Set Your New Password</p>
        <div class="alert alert-warning text-center py-2 mb-3" style="font-size:0.85rem;">
            You must change your temporary password before continuing.
        </div>

        <div id="alert" class="alert d-none"></div>

        <form id="changeForm">
            <div class="mb-3">
                <label class="form-label">Current (Temporary) Password</label>
                <input type="password" id="currentPassword" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" id="newPassword" class="form-control" required minlength="8">
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm New Password</label>
                <input type="password" id="confirmPassword" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Set Password</button>
        </form>
    </div>

    <script>
        const user = JSON.parse(sessionStorage.getItem('user'));
        if (!user) window.location.href = '/index.html';

        document.getElementById('changeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const alertEl = document.getElementById('alert');

            if (newPassword !== confirmPassword) {
                alertEl.className = 'alert alert-danger';
                alertEl.textContent = 'New passwords do not match.';
                alertEl.classList.remove('d-none');
                return;
            }

            const res = await fetch('/api/auth/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: user.email, currentPassword, newPassword })
            });

            const data = await res.json();

            if (!res.ok) {
                alertEl.className = 'alert alert-danger';
                alertEl.textContent = data.message;
                alertEl.classList.remove('d-none');
                return;
            }

            alertEl.className = 'alert alert-success';
            alertEl.textContent = 'Password changed! Redirecting...';
            alertEl.classList.remove('d-none');

            setTimeout(() => window.location.href = '/index.html', 1500);
        });
    </script>
</body>
</html>
